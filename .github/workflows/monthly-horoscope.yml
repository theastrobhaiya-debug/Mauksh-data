name: Monthly Horoscope

on:
  schedule:
    # 1st of every month at 8:00 AM IST
    - cron: "30 2 1 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-monthly:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install openai

      - name: Generate monthly horoscope
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python scripts/generate_monthly_horoscope.py

      - name: Commit monthly horoscope
        run: |
          git config user.name "Mauksh Horoscope Bot"
          git config user.email "actions@github.com"
          git add Horoscope2.json
          git diff --cached --quiet || git commit -m "Update monthly horoscope"
          git push
