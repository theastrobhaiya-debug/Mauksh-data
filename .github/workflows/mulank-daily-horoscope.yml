name: Mauksh Daily Mulank Horoscope

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate-mulank-horoscope:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install openai requests pillow

      - name: Run Mulank Horoscope
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

          BUFFER_ACCESS_TOKEN: ${{ secrets.BUFFER_ACCESS_TOKEN }}

          BUFFER_X_ACCESS_TOKEN: ${{ secrets.BUFFER_X_ACCESS_TOKEN }}

          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}

          OPENAI_MODEL: gpt-5-mini

        run: |
          python scripts/mulank_daily_horoscope.py
