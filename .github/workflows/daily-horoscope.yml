name: Daily Horoscope

on:
  schedule:
    - cron: "30 2 * * *"
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install openai

      - name: Generate horoscope
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python scripts/generate_horoscope.py

      - name: Commit horoscope
        run: |
          git config user.name "Mauksh Horoscope Bot"
          git config user.email "actions@github.com"
          git add Horoscope.json
          git diff --cached --quiet || git commit -m "Update daily horoscope"
          git push
