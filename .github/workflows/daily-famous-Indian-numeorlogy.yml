
name: Daily Famous Indian Numerology

on:
  schedule:
    # 8:00 AM IST = 2:30 AM UTC
    - cron: "30 2 * * *"

  workflow_dispatch:
    inputs:
      preview:
        description: "Generate preview without publishing"
        required: false
        type: boolean
        default: false

      force:
        description: "Force regeneration and publishing"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: daily-famous-indian-numerology
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openai requests

      - name: Run daily numerology
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          BUFFER_X_ACCESS_TOKEN: ${{ secrets.BUFFER_X_ACCESS_TOKEN }}
    
        run: |
          ARGS=""

          if [ "${{ inputs.preview }}" = "true" ]; then
            ARGS="$ARGS --preview"
          fi

          if [ "${{ inputs.force }}" = "true" ]; then
            ARGS="$ARGS --force"
          fi

          python scripts/daily_famous_numerology.py $ARGS

      - name: Save daily history
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/famous_numerology/

          if ! git diff --cached --quiet; then
            git commit -m "Update daily famous numerology history"
            git push
          else
            echo "No history changes to commit"
          fi
