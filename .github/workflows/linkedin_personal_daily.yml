name: Personal LinkedIn Daily Post

on:

  workflow_dispatch:

jobs:
  linkedin-post:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install openai requests

      - name: Generate and publish LinkedIn post
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_PERSON_ID: ${{ secrets.LINKEDIN_PERSON_ID }}
        run: |
          python scripts/linkedin_personal.py

      - name: Save posting history
        run: |
          git config user.name "LinkedIn Automation"
          git config user.email "actions@github.com"

          git add data/linkedin_personal_history.json

          git diff --cached --quiet || \
            git commit -m "Update personal LinkedIn post history"

          git push