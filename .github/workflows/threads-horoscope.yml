name: Mauksh Threads Horoscope

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install OpenAI
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade openai

      - name: Find horoscope script
        id: find_script
        run: |
          FILE=$(find . -type f -name "threads_horoscope.py" | head -n 1)

          if [ -z "$FILE" ]; then
            echo "ERROR: threads_horoscope.py was not found."
            echo "Repository files:"
            find . -maxdepth 4 -type f | sort
            exit 1
          fi

          echo "Found: $FILE"
          echo "file=$FILE" >> "$GITHUB_OUTPUT"

      - name: Generate Mauksh Daily Horoscope
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python "${{ steps.find_script.outputs.file }}"