name: Mauksh Daily Career Horoscope

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate-and-post:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openai requests

      - name: Generate and publish career horoscope
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          MAUKSH_CAREER_BUFFER_TOKEN: ${{ secrets.MAUKSH_CAREER_BUFFER_TOKEN }}
        run: |
          python scripts/linkedin_horoscope.py
