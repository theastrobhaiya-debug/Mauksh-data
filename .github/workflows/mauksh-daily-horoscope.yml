
name: Mauksh Daily Horoscope

on:
  workflow_dispatch:

  
    

permissions:
  contents: read

jobs:
  generate-horoscope:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r horoscope_instagram/requirements.txt

      - name: Generate horoscope poster
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          BUFFER_ACCESS_TOKEN: ${{ secrets.BUFFER_ACCESS_TOKEN }}
          PREVIEW_ONLY: "false"
        run: python horoscope_instagram/main.py
