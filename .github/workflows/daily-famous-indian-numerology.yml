
name: Mauksh Daily Famous Numerology

on:
  schedule:
    # 8:00 AM IST
    - cron: "30 2 * * *"

  workflow_dispatch:
    inputs:
      preview:
        description: "Preview without publishing"
        type: boolean
        default: false

      force:
        description: "Force republishing"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: daily-famous-numerology
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install requirements
        run: |
          pip install -r requirements.txt

      - name: Run Birthday Numerology
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          BUFFER_X_ACCESS_TOKEN: ${{ secrets.BUFFER_X_ACCESS_TOKEN }}
          BUFFER_X_CHANNEL_NAME: ${{ vars.BUFFER_X_CHANNEL_NAME }}
        run: |
          ARGS=""

          if [ "${{ inputs.preview }}" = "true" ]; then
            ARGS="$ARGS --preview"
          fi

          if [ "${{ inputs.force }}" = "true" ]; then
            ARGS="$ARGS --force"
          fi

          python scripts/daily_famous_numerology.py $ARGS

      - name: Save history to GitHub
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/famous_numerology/

          if ! git diff --cached --quiet; then
            git commit -m "Update daily famous numerology history"
            git push
          else
            echo "No history changes."
          fi
